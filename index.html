<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🪷</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #080808;
            color: white;
            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }

        .profile {
            width: 380px;
            padding: 35px;
            text-align: center;

            background: #101010;
            border: 1px solid #252525;
            border-radius: 18px;

            box-shadow: 0 0 50px rgba(255, 80, 180, 0.08);
        }

        .avatar {
            width: 90px;
            height: 90px;
            margin: 0 auto 18px;

            border-radius: 50%;
            background: #ff4fa3;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 30px;
            font-weight: bold;

            box-shadow: 0 0 30px rgba(255, 79, 163, 0.35);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .username {
            color: #ff4fa3;
            margin-bottom: 18px;
        }

        .bio {
            color: #888;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .links a {
            display: block;
            padding: 13px;

            color: white;
            text-decoration: none;

            background: #181818;
            border: 1px solid #292929;
            border-radius: 10px;

            transition: 0.2s;
        }

        .links a:hover {
            transform: translateY(-2px);
            border-color: #ff4fa3;
            color: #ff4fa3;
            box-shadow: 0 0 20px rgba(255, 79, 163, 0.12);
        }

        .footer {
            margin-top: 25px;
            color: #444;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="profile">

        <div class="avatar">
            H
        </div>

        <h1>HOSTILE</h1>

        <div class="username">
            @greis
        </div>

        <p class="bio">
            your little corner of the internet.
        </p>

        <div class="links">
            <a href="#">greis</a>
            <a href="#">is de allerliefste</a>
            <a href="#">HG.</a>
        </div>

        <div class="footer">
            hosted with leoart zijn brein
        </div>

    </div>

</body>
</html>
